<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pwallet - Finanças Pessoais</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      background-color: #1f2937;
      width: 250px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }
    .sidebar a {
      color: #9ca3af;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #2563eb;
      color: white;
    }
    .sidebar a i {
      margin-right: 0.75rem;
      font-size: 1.25rem;
    }
    .content {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      height: 100vh;
      background-color: #18181b;
    }
    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .card {
      background-color: #27272a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="sidebar" aria-label="Sidebar Navigation">
      <a href="#" class="active" data-section="dashboard" aria-current="page"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
      <a href="#" data-section="accounts"><i class="fas fa-wallet"></i>Contas</a>
      <a href="#" data-section="entries"><i class="fas fa-list"></i>Entradas</a>
      <a href="#" data-section="investments"><i class="fas fa-chart-line"></i>Investimentos</a>
      <a href="#" data-section="settings"><i class="fas fa-cog"></i>Configurações</a>
    </nav>
    <main class="content" id="main-content" tabindex="-1">
      <!-- Dashboard Section -->
      <section id="dashboard" class="section active" role="region" aria-label="Dashboard">
        <h1>Dashboard</h1>
        <div class="card">
          <h2>Saldo Total</h2>
          <p id="total-balance" class="text-3xl font-bold">R$ 0,00</p>
        </div>
        <div class="card">
          <h2>Despesas por Categoria</h2>
          <div class="chart-container">
            <canvas id="expensesPieChart" aria-label="Gráfico de pizza das despesas por categoria" role="img"></canvas>
          </div>
        </div>
        <div class="card">
          <h2>Evolução do Saldo</h2>
          <div class="chart-container">
            <canvas id="balanceLineChart" aria-label="Gráfico de linha da evolução do saldo" role="img"></canvas>
          </div>
        </div>
      </section>

      <!-- Accounts Section -->
      <section id="accounts" class="section hidden" role="region" aria-label="Contas">
        <h1>Contas</h1>
        <form id="account-form" class="mb-4" aria-label="Formulário de cadastro de conta">
          <div class="mb-2">
            <label for="account-name" class="block mb-1">Nome da Conta</label>
            <input type="text" id="account-name" name="accountName" required class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="account-balance" class="block mb-1">Saldo Inicial (R$)</label>
            <input type="number" id="account-balance" name="accountBalance" required min="0" step="0.01" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded transition">Adicionar Conta</button>
        </form>
        <ul id="accounts-list" class="space-y-2" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>

      <!-- Entries Section -->
      <section id="entries" class="section hidden" role="region" aria-label="Entradas">
        <h1>Entradas</h1>
        <form id="entry-form" class="mb-4" aria-label="Formulário de registro de entrada">
          <div class="mb-2">
            <label for="entry-amount" class="block mb-1">Valor (R$)</label>
            <input type="number" id="entry-amount" name="entryAmount" required min="0" step="0.01" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="entry-category" class="block mb-1">Categoria</label>
            <select id="entry-category" name="entryCategory" required class="w-full rounded px-3 py-2 text-black">
              <option value="">Selecione</option>
              <option value="alimentação">Alimentação</option>
              <option value="transporte">Transporte</option>
              <option value="moradia">Moradia</option>
              <option value="lazer">Lazer</option>
              <option value="saúde">Saúde</option>
              <option value="outros">Outros</option>
            </select>
          </div>
          <div class="mb-2">
            <label for="entry-date" class="block mb-1">Data</label>
            <input type="date" id="entry-date" name="entryDate" required class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="entry-description" class="block mb-1">Descrição</label>
            <input type="text" id="entry-description" name="entryDescription" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="entry-account" class="block mb-1">Conta</label>
            <select id="entry-account" name="entryAccount" required class="w-full rounded px-3 py-2 text-black">
              <option value="">Selecione</option>
            </select>
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded transition">Adicionar Entrada</button>
        </form>
        <div class="mb-4">
          <label for="filter-category" class="block mb-1">Filtrar por Categoria</label>
          <select id="filter-category" class="w-full rounded px-3 py-2 text-black">
            <option value="">Todas</option>
            <option value="alimentação">Alimentação</option>
            <option value="transporte">Transporte</option>
            <option value="moradia">Moradia</option>
            <option value="lazer">Lazer</option>
            <option value="saúde">Saúde</option>
            <option value="outros">Outros</option>
          </select>
        </div>
        <div class="mb-4">
          <label for="filter-month" class="block mb-1">Filtrar por Mês</label>
          <input type="month" id="filter-month" class="w-full rounded px-3 py-2 text-black" />
        </div>
        <ul id="entries-list" class="space-y-2" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>

      <!-- Investments Section -->
      <section id="investments" class="section hidden" role="region" aria-label="Investimentos">
        <h1>Investimentos</h1>
        <form id="investment-form" class="mb-4" aria-label="Formulário de registro de investimento">
          <div class="mb-2">
            <label for="investment-asset" class="block mb-1">Nome do Ativo</label>
            <input type="text" id="investment-asset" name="investmentAsset" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="investment-value" class="block mb-1">Valor (R$)</label>
            <input type="number" id="investment-value" name="investmentValue" min="0" step="0.01" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="investment-date" class="block mb-1">Data</label>
            <input type="date" id="investment-date" name="investmentDate" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="investment-type" class="block mb-1">Tipo</label>
            <input type="text" id="investment-type" name="investmentType" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <div class="mb-2">
            <label for="investment-yield" class="block mb-1">Rendimento (%)</label>
            <input type="number" id="investment-yield" name="investmentYield" min="0" step="0.01" class="w-full rounded px-3 py-2 text-black" />
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded transition">Adicionar Investimento</button>
        </form>
        <ul id="investments-list" class="space-y-2" aria-live="polite" aria-relevant="additions removals"></ul>
      </section>

      <!-- Settings Section -->
      <section id="settings" class="section hidden" role="region" aria-label="Configurações">
        <h1>Configurações</h1>
        <p>Configurações futuras serão adicionadas aqui.</p>
      </section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
